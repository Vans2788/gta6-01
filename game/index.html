<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Solara City — an original top-down open-world crime game: drive, steal cars, outrun the police and run jobs across a sun-soaked coastal city.">
<title>Solara City — Open World</title>
<style>
  /* Full-bleed canvas, no scrollbars, dark letterbox behind the game. */
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b0e1a; }
  #wrap { position: fixed; inset: 0; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #status { position: fixed; left: 8px; bottom: 6px; color: #8a93b8; font: 11px/1.4 system-ui, sans-serif; opacity: .7; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="800"></canvas></div>
<div id="status"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
